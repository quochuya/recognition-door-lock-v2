# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_lock
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- MQTT (EMQX hoặc broker khác) ---
mqtt.broker-url=tcp://broker.emqx.io:1883
mqtt.client-id=lock-backend-huy
mqtt.username=
mqtt.password=

# --- App ---
server.port=8080
spring.task.scheduling.pool.size=2

# --- JWT ---
# Đổi secret này trước khi deploy thật — tối thiểu 32 ký tự cho HS256
jwt.secret=change-this-to-a-long-random-secret-key-before-production-use
jwt.expiration-minutes=480

# --- Debug: xem lý do chính xác khi 1 request bị 403 do JWT ---
logging.level.com.example.lock.security=DEBUG
